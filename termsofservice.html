		<title>Rafisol Terms of Service</title>

		<meta property="og:type" content="website">

		<meta property="og:title" content="Rafisol Terms of Service">

		<meta name="theme-color" content="#F395F6">
		<!-- Bootstrap -->
		<link href="siteresources/bootstrap-4.4.1.css" rel="stylesheet">
		<link href="siteresources/style.css" rel="stylesheet">
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
			<a class="navbar-brand" href="index.html">[back to Rafisol]</a>
		</nav>

		<div class="jumbotron jumbotron-fluid">
			<div class="container">
				<h1 class="display-4"><img id="brandicon" src="siteresources/icon.png" alt="">Rafisol Terms of Service</h1>
			</div>
		</div>

		<div class="container">
			<div class="row">
				<div class="col-12 text-left" id="markdownContent">
					<p class="text-center">Loading...</p>
				</div>
			</div>
		</div>
		<hr>
		<div class="container text-center">
			<p>This page is also available as Terms_of_Service.md.</p>
			<a class="btn btn-dark" href="https://github.com/etangaming123/rafisol/blob/main/Terms_of_Service.md">Open Terms_of_Service.md</a>

		</div>
		<hr>
		<footer class="text-center mt-4">
			<p>etan • etangaming123 • etangamingxyz</p>
		</footer>
		<script src="siteresources/marked.min.js"></script> <!-- markdown parser, renders Terms_of_Service.md below -->
		<script>
			marked.setOptions({ breaks: true, gfm: true });
			fetch('Terms_of_Service.md')
				.then(response => response.text())
				.then(markdown => {
					document.getElementById('markdownContent').innerHTML = marked.parse(markdown);
				})
				.catch(() => {
					document.getElementById('markdownContent').innerHTML = '<p class="text-center">Couldn\'t load Terms_of_Service.md.</p>';
				});
		</script>
	</body>
